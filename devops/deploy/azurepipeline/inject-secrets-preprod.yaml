# Preprod secret injection pipeline
# Requires an approved Azure DevOps variable group named adp-secrets-preprod.
# Never use production credentials or commit real values here.
trigger: none

variables:
  - group: adp-secrets-preprod

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Apply preprod Kubernetes Secret
    inputs:
      azureSubscription: 'subs-maritimecluster-prod (a43e6b1a-8f8d-43f4-85e5-85478689e4ba)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cat > /tmp/adp-preprod-secrets.env <<'EOF'
        JWT_SECRET=$(JWT_SECRET)
        REDIS_PASSWORD=$(REDIS_PASSWORD)
        MONGODB_URI=$(MONGODB_URI)
        SERVICEBUS_CONNECTION_STRING=$(SERVICEBUS_CONNECTION_STRING)
        AZURE_SERVICEBUS_INVENTORY=$(AZURE_SERVICEBUS_INVENTORY)
        ACS_EMAIL_CONNECTION_STRING=$(ACS_EMAIL_CONNECTION_STRING)
        AZURE_COMM_CONNSTR_USERS=$(AZURE_COMM_CONNSTR_USERS)
        ELASTICSEARCH_API_KEY=$(ELASTICSEARCH_API_KEY)
        AZURE_BLOB_SAS_URL=$(AZURE_BLOB_SAS_URL)
        EOF
        az aks command invoke \
          --resource-group az-emb-pr-uaen-automarketplace-aks-rg \
          --name az-automotivemarketplace-pr-uaen-aks \
          --command "kubectl create namespace adp-preprod --dry-run=client -o yaml | kubectl apply -f -"
        az aks command invoke \
          --resource-group az-emb-pr-uaen-automarketplace-aks-rg \
          --name az-automotivemarketplace-pr-uaen-aks \
          --command "kubectl create secret generic adp-secrets --namespace adp-preprod --from-env-file=adp-preprod-secrets.env --dry-run=client -o yaml | kubectl apply -f -" \
          --file /tmp/adp-preprod-secrets.env
