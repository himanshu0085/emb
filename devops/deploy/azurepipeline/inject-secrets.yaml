# ============================================================
#  ADP Platform – Inject Secrets to Prod AKS
#  PRODUCTION environment
#
#  Use this pipeline to update secrets without redeploying
#  the full service.
#
#  Trigger: Manual only
# ============================================================
trigger: none

variables:
  - group: adp-secrets-prod

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: AzureCLI@2
    displayName: 'Inject all secrets into adp-secrets (Prod)'
    inputs:
      azureSubscription: 'subs-maritimecluster-prod (a43e6b1a-8f8d-43f4-85e5-85478689e4ba)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account set --subscription a43e6b1a-8f8d-43f4-85e5-85478689e4ba

        # Write secret values to a local env file — avoids long --command strings
        # and safely handles special characters in connection strings
        {
          echo "JWT_SECRET=$(JWT_SECRET)"
          echo "REDIS_PASSWORD=$(REDIS_PASSWORD)"
          echo "MONGODB_URI=$(MONGODB_URI)"
          echo "SERVICEBUS_CONNECTION_STRING=$(SERVICEBUS_CONNECTION_STRING)"
          echo "AZURE_SERVICEBUS_INVENTORY=$(AZURE_SERVICEBUS_INVENTORY)"
          echo "AZURE_COMM_CONNSTR_USERS=$(AZURE_COMM_CONNSTR_USERS)"
          echo "AZURE_COMM_EMAIL_FROM_USERS=$(AZURE_COMM_EMAIL_FROM_USERS)"
          echo "ELASTICSEARCH_API_KEY=$(ELASTICSEARCH_API_KEY)"
          echo "USER_DEFAULT_PASSWORD=Welcome@123"
          echo "RECAPTCHA_SECRET_KEY=$(RECAPTCHA_SECRET_KEY)"
          echo "ACS_EMAIL_CONNECTION_STRING=$(ACS_EMAIL_CONNECTION_STRING)"
          echo "ACS_EMAIL_FROM=$(ACS_EMAIL_FROM)"
          echo "AZURE_BLOB_SAS_URL=$(AZURE_BLOB_SAS_URL)"
          echo "AZURE_BLOB_SAS_URL_PRIVATE=$(AZURE_BLOB_SAS_URL_PRIVATE)"
        } > /tmp/adp-secrets.env
        sed 's/=.*/=***/' /tmp/adp-secrets.env # log keys only

        # Create namespace and apply secret via env file — short --command, file handles values
        az aks command invoke \
          --resource-group az-emb-pr-uaen-automarketplace-aks-rg \
          --name az-automotivemarketplace-pr-uaen-aks \
          --command "kubectl create namespace adp --dry-run=client -o yaml | kubectl apply -f -"

        az aks command invoke \
          --resource-group az-emb-pr-uaen-automarketplace-aks-rg \
          --name az-automotivemarketplace-pr-uaen-aks \
          --command "kubectl create secret generic adp-secrets --namespace adp --from-env-file=adp-secrets.env --dry-run=client -o yaml | kubectl apply -f - && echo 'Secrets applied successfully'" \
          --file /tmp/adp-secrets.env

  - task: AzureCLI@2
    displayName: 'Restart services to pick up new secrets'
    inputs:
      azureSubscription: 'subs-maritimecluster-prod (a43e6b1a-8f8d-43f4-85e5-85478689e4ba)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account set --subscription a43e6b1a-8f8d-43f4-85e5-85478689e4ba
        az aks command invoke \
          --resource-group az-emb-pr-uaen-automarketplace-aks-rg \
          --name az-automotivemarketplace-pr-uaen-aks \
          --command "kubectl rollout restart deployment/adp-inventory deployment/adp-analytics deployment/adp-communication deployment/adp-users deployment/adp-authentication deployment/adp-chat deployment/adp-orders -n adp && echo 'All restarts triggered'"