apiVersion: apps/v1
kind: Deployment
metadata:
  name: adp-cms
  namespace: adp-preprod
  labels:
    app: adp-cms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adp-cms
  template:
    metadata:
      labels:
        app: adp-cms
    spec:
      containers:
        - name: adp-cms
          image: adpgamppruaencr.azurecr.io/adp-cms:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8093
          env:
            - name: SPRING_MAIN_LAZY_INITIALIZATION
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: SPRING_MAIN_LAZY_INITIALIZATION
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: EUREKA_URL
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: MONGODB_URI
            # Workaround: adp_cms database not yet seeded, using adp_masters temporarily
            - name: SPRING_DATA_MONGODB_DATABASE
              value: "adp_masters"
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: REDIS_PORT
            - name: SPRING_DATA_REDIS_SSL_ENABLED
              value: "true"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: REDIS_PASSWORD
            # JWT secret (VAPT: from Secret, not ConfigMap)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: JWT_SECRET
            # CORS
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: CMS_CORS_ALLOWED_ORIGINS
            # Spring Boot 2.4+ legacy processing — required for profile-specific properties
            - name: SPRING_CONFIG_USE_LEGACY_PROCESSING
              value: "true"
            # Prevent Eureka registering pod names (gateway cannot resolve them)
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 8093
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8093
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: adp-cms-service
  namespace: adp-preprod
spec:
  selector:
    app: adp-cms
  ports:
    - port: 8093
      targetPort: 8093
