apiVersion: apps/v1
kind: Deployment
metadata:
  name: adp-discovery
  namespace: adp-preprod
  labels:
    app: adp-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adp-discovery
  template:
    metadata:
      labels:
        app: adp-discovery
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: adp-discovery
          image: adpgamppruaencr.azurecr.io/adp-discovery:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: JWT_SECRET
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            - name: SPRING_CONFIG_USE_LEGACY_PROCESSING
              value: "true"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: adp-discovery
  namespace: adp-preprod
spec:
  selector:
    app: adp-discovery
  ports:
    - port: 8761
      targetPort: 8761