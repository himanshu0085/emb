---
# ── Deny Azure IMDS Egress (SSRF protection) ─────────────────
# Blocks pods from reaching the Azure Instance Metadata Service
# endpoint (169.254.169.254) which could be abused via SSRF.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-azure-imds-egress
  namespace: adp-preprod
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
