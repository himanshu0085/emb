# ============================================================
#  ADP Platform – Network Policies (VAPT Fix: Function-Level Auth)
#
#  Restricts direct pod-to-pod access so that downstream
#  services only accept traffic from the gateway (adp-authentication).
#  Prevents bypass of JWT validation if pods are reachable via
#  kubectl port-forward, NodePort, or misconfigured routes.
#
#  Apply with:
#    kubectl apply -f k8s/backend/network-policy.yaml
# ============================================================

# ── Orders Service ───────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-gateway-to-orders
  namespace: adp-preprod
spec:
  podSelector:
    matchLabels:
      app: adp-orders
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: adp-authentication
        - podSelector:
            matchLabels:
              app: adp-analytics
      ports:
        - protocol: TCP
          port: 8082

---
# ── Masters Service ──────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-gateway-to-masters
  namespace: adp-preprod
spec:
  podSelector:
    matchLabels:
      app: adp-masters
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: adp-authentication
        # adp-inventory calls adp-masters-service:8085/api/filters/by-name while building the
        # vehicle detail page; without this the connect is dropped -> ~10s connect-timeout per load.
        - podSelector:
            matchLabels:
              app: adp-inventory
      ports:
        - protocol: TCP
          port: 8085

---
