apiVersion: apps/v1
kind: Deployment
metadata:
  name: adp-orders
  namespace: adp
  labels:
    app: adp-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adp-orders
  template:
    metadata:
      labels:
        app: adp-orders
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: adp-orders
          image: adpgamppruaencr.azurecr.io/adp-orders:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_MAIN_LAZY_INITIALIZATION
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: SPRING_MAIN_LAZY_INITIALIZATION
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: EUREKA_URL
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: MONGODB_URI
            - name: SPRING_DATA_MONGODB_DATABASE
              value: "adp_orders"
            - name: SPRING_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: REDIS_HOST
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: REDIS_PASSWORD
            - name: SPRING_REDIS_SSL
              value: "true"
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: JWT_SECRET
            - name: SPRING_CONFIG_USE_LEGACY_PROCESSING
              value: "true"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: AZURE_SERVICEBUS_QUEUE_NAME
              value: "adp-orders"
            - name: INVENTORY_SERVICE_URL
              value: "http://adp-inventory-service:8084"
            - name: NEGOTIATION_SERVICE_URL
              value: "http://adp-chat-service:8090"
            - name: USERS_SERVICE_URL
              value: "http://adp-users-service:8087"
            - name: COMMUNICATION_SERVICE_URL
              value: "http://adp-communication-service:8084"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: adp-orders-service
  namespace: adp
spec:
  selector:
    app: adp-orders
  ports:
    - port: 8082
      targetPort: 8082