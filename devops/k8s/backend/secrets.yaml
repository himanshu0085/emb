# ============================================================
#  ADP Platform – Kubernetes Secret Template (AKS)
#
#  DO NOT commit real values to git.
#  Create this secret with kubectl instead:
#
#    kubectl create secret generic adp-secrets \
#      --namespace adp \
#      --from-literal=JWT_SECRET='<256-bit-prod-key>' \
#      --from-literal=REDIS_PASSWORD='<azure-cache-access-key>' \
#      --from-literal=MONGODB_URI='<cosmos-db-connection-string>' \
#      --from-literal=SERVICEBUS_CONNECTION_STRING='<service-bus-connstr>' \
#      --from-literal=ACS_EMAIL_CONNECTION_STRING='<acs-connstr>' \
#      --from-literal=ACS_EMAIL_FROM='noreply@adpgauto.com' \
#      --from-literal=AZURE_SERVICEBUS_INVENTORY='<inventory-sb-connstr>' \
#      --from-literal=AZURE_BLOB_SAS_URL='<blob-sas-url>' \
#      --from-literal=AZURE_COMM_CONNSTR_USERS='<acs-users-connstr>' \
#      --from-literal=ELASTICSEARCH_API_KEY='<elastic-cloud-api-key>'
#
#  This file is a TEMPLATE showing the structure only.
#  Values below are placeholders and will NOT work.
#
#  Alternative: Use Azure Key Vault via the CSI Secret Store driver.
#  Reference: https://docs.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: adp-secrets
  namespace: adp
type: Opaque
stringData:
  # ── JWT signing key ─────────────────────────────────────────
  # Shared across: authentication (gateway), analytics, inventory, users, orders, cms
  # Source: adp-secrets-prod variable group in Azure DevOps Library
  JWT_SECRET: "vK7m8S5N9X2Wp4Rz1Qj0Gb6Lh3Vf9Yt5M8As2Dn4Kxl="

  # ── Azure Cache for Redis ────────────────────────────────────
  # Primary access key from Azure Portal → Cache → Access keys
  # Source: adp-secrets-prod variable group in Azure DevOps Library
  REDIS_PASSWORD: "O4WIpSOOkvS4QPpSMaNeRYYalo3bsJVuMAzCaHSsZpg="

  # ── Default user password ─────────────────────────────────────
  # Default password assigned to new user accounts on creation
  USER_DEFAULT_PASSWORD: "Welcome@123"

  # ── MongoDB Atlas ────────────────────────────────────────────
  # Full SRV connection string from MongoDB Atlas → Clusters → Connect → Drivers
  # Format: mongodb+srv://<username>:<password>@<cluster-id>.mongodb.net/<dbname>?retryWrites=true&w=majority
  # NOTE: Change streams (used by inventory + users for ES sync) require
  #       an M10 or higher Atlas cluster tier (not free M0).
  MONGODB_URI: "REPLACE_WITH_MONGODB_ATLAS_CONNECTION_STRING"

  # ── Azure Service Bus (communication service) ───────────────
  # Namespace connection string from Azure Portal → Service Bus → Shared access policies
  SERVICEBUS_CONNECTION_STRING: "REPLACE_WITH_SERVICE_BUS_CONNECTION_STRING"

  # ── Azure Service Bus (inventory service) ───────────────────
  # The inventory service uses a SEPARATE Service Bus queue for ES data sync.
  # Source: azure.servicebus.connection-string in inventory application.properties
  # (currently hardcoded as pre-prod key - MUST be moved to secret)
  AZURE_SERVICEBUS_INVENTORY: "REPLACE_WITH_INVENTORY_SERVICE_BUS_CONNECTION_STRING"

  # ── Azure Communication Services – Email (communication svc) ─
  # Connection string from Azure Portal → Communication Services → Keys
  ACS_EMAIL_CONNECTION_STRING: "REPLACE_WITH_ACS_EMAIL_CONNECTION_STRING"
  ACS_EMAIL_FROM: "noreply@globalautotrade.com"

  # ── Azure Communication Services – Users service ─────────────
  # The users service has its OWN ACS connection for sending OTP emails.
  # Source: azure.communication.connection-string in users application.properties
  AZURE_COMM_CONNSTR_USERS: "REPLACE_WITH_ACS_USERS_CONNECTION_STRING"
  AZURE_COMM_EMAIL_FROM_USERS: "noreply@globalautotrade.com"

  # ── Azure Blob Storage SAS URL (users service) ───────────────
  # For user document uploads. Source: azure.storage.sas.url in users application.properties
  # IMPORTANT: The pre-prod SAS URL expires 2026-11-17. Generate a new SAS for prod.
  # Azure Portal → Storage Account → Containers → preprodblobadp-bucket → Generate SAS
  AZURE_BLOB_SAS_URL: "REPLACE_WITH_PRODUCTION_BLOB_SAS_URL"

  # ── Elasticsearch API key (analytics + inventory) ─────────────
  # From Elastic Cloud Portal → Deployments → Security → API keys
  # Used by analytics and inventory services if connecting to Elastic Cloud.
  # Leave empty if self-hosting Elasticsearch in AKS (uses unauthenticated HTTP).
  ELASTICSEARCH_API_KEY: "REPLACE_WITH_ELASTIC_CLOUD_API_KEY"
