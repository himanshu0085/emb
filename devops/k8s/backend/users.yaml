apiVersion: apps/v1
kind: Deployment
metadata:
  name: adp-users
  namespace: adp
  labels:
    app: adp-users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adp-users
  template:
    metadata:
      labels:
        app: adp-users
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: adp-users
          image: adpgamppruaencr.azurecr.io/adp-users:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
            - name: SPRING_MAIN_LAZY_INITIALIZATION
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: SPRING_MAIN_LAZY_INITIALIZATION
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: EUREKA_URL
            - name: SPRING_DATA_MONGODB_DATABASE
              value: "adp_users"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: adp-backend-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_SSL
              value: "true"
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: JWT_SECRET
            - name: OTP_SEND_EMAIL
              value: "true"
            - name: USER_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: USER_DEFAULT_PASSWORD
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: COMMUNICATION_SERVICE_URL
              value: "http://adp-communication-service:8084"
            - name: SPRING_CONFIG_USE_LEGACY_PROCESSING
              value: "true"
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: MONGODB_URI
            - name: AZURE_COMMUNICATION_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: AZURE_COMM_CONNSTR_USERS
            - name: AZURE_COMMUNICATION_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: ACS_EMAIL_FROM
            - name: AZURE_BLOB_SAS_URL
              valueFrom:
                secretKeyRef:
                  name: adp-secrets
                  key: AZURE_BLOB_SAS_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: adp-users-service
  namespace: adp
spec:
  selector:
    app: adp-users
  ports:
    - port: 8087
      targetPort: 8087