apiVersion: v1
kind: Secret
metadata:
  name: adp-secrets
  namespace: adp-preprod
type: Opaque
stringData:
  # Populate from an approved preprod Key Vault / Azure DevOps variable group.
  # Do not commit real credentials.
  JWT_SECRET: "REPLACE_FROM_PREPROD_SECRET_STORE"
  REDIS_PASSWORD: "REPLACE_FROM_PREPROD_SECRET_STORE"
  MONGODB_URI: "REPLACE_WITH_PREPROD_DATABASE_URI"
  SERVICEBUS_CONNECTION_STRING: "REPLACE_WITH_PREPROD_SERVICEBUS_CONNECTION_STRING"
  AZURE_SERVICEBUS_INVENTORY: "REPLACE_WITH_PREPROD_INVENTORY_SERVICEBUS_CONNECTION_STRING"
  ACS_EMAIL_CONNECTION_STRING: "REPLACE_WITH_PREPROD_ACS_CONNECTION_STRING"
  AZURE_COMM_CONNSTR_USERS: "REPLACE_WITH_PREPROD_USERS_ACS_CONNECTION_STRING"
  ELASTICSEARCH_API_KEY: "REPLACE_FROM_PREPROD_SECRET_STORE"
  AZURE_BLOB_SAS_URL: "REPLACE_WITH_PREPROD_BLOB_SAS_URL"
